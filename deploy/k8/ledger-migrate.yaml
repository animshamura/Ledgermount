apiVersion: batch/v1
kind: Job
metadata:
  name: ledger-migrate
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: ledger-migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: ledger-api:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "django", "migrate", "--noinput"]
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: config.settings.base
            - name: DB_HOST
              value: postgres
            - name: DB_NAME
              value: ledger_prod
            - name: DB_USER
              value: postgres
            - name: DB_PASSWORD
              value: secure_password_here
            - name: REDIS_URL
              value: redis://redis:6379/0
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 512Mi