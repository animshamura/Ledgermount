[project]
name = "ledgermount-backend"
version = "1.0.0"
description = "Transactional, double-entry ledger backend and staff operations API."
requires-python = ">=3.13,<3.14"
dependencies = [
  "django>=5.0,<6.0",
  "djangorestframework>=3.15,<4.0",
  "celery[redis]>=5.3,<6.0",
  "redis>=5.0,<6.0",
  "psycopg[binary]>=3.1,<4.0",
  "django-prometheus>=2.3,<3.0",
  "drf-spectacular>=0.29,<0.30",
  "requests>=2.31,<3.0",
  "gunicorn>=21.2,<22.0",
  "uvicorn[standard]>=0.27,<0.28",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.vercel]
entrypoint = "config.wsgi:application"

[[tool.vercel.subscribers]]
entrypoint = "worker:app"
